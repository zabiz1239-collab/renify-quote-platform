name: Bug report
description: Report a reproducible problem without including secret or personal data
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove tokens, credentials, personal data, production records, and other sensitive values from all examples and logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what is the impact?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App/version/commit
      placeholder: version, release, or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser/device, runtime, deployment environment, and relevant non-secret configuration.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact secrets and personal/production data before pasting.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, credentials, personal data, and production records.
          required: true
